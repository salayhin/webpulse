<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebPulse — Daily Limit Reached</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: #fff;
        border-radius: 16px;
        padding: 40px;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        text-align: center;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        color: #111;
        letter-spacing: -0.5px;
      }
      .domain {
        font-size: 14px;
        color: #667eea;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .message {
        font-size: 14px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .reset-time {
        background: #f5f5f5;
        border-left: 3px solid #667eea;
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 13px;
        color: #333;
        margin-bottom: 24px;
        text-align: left;
      }
      .button {
        display: inline-block;
        padding: 10px 24px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        text-decoration: none;
      }
      .button-primary {
        background: #667eea;
        color: #fff;
        margin-right: 8px;
      }
      .button-primary:hover {
        background: #5568d3;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }
      .button-secondary {
        background: #f0f0f5;
        color: #667eea;
        text-decoration: none;
      }
      .button-secondary:hover {
        background: #e8e8f2;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-top: 20px;
      }
      .button { flex: 1; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">⏸️</div>
      <h1>Daily Limit Reached</h1>
      <div class="domain" id="domain"></div>
      <div class="message">You've used your daily time limit on this site.</div>
      <div class="reset-time">
        <strong>Resets at midnight</strong><br/>
        <span id="resetTime"></span>
      </div>
      <div class="buttons">
        <button class="button button-primary" onclick="defer()">Defer 15 min</button>
        <a href="chrome-extension://PLACEHOLDER/dashboard.html" class="button button-secondary">Settings</a>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
