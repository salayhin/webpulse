<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebPulse — Limit Reached</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .page { text-align: center; max-width: 560px; }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 700;
        color: #6b7280;
        margin-bottom: 48px;
      }
      .brand-icon { width: 32px; height: 32px; flex-shrink: 0; }
      .headline { font-size: 22px; color: #111; margin: 0 0 24px; }
      .site {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .site img { width: 32px; height: 32px; }
      .site span { font-size: 24px; font-weight: 700; color: #111; }
      .url { font-size: 14px; color: #9ca3af; margin: 0 0 28px; word-break: break-all; }
      .facts {
        display: inline-grid;
        grid-template-columns: auto auto;
        gap: 6px 32px;
        font-size: 17px;
        margin-bottom: 32px;
      }
      .facts .label { text-align: left; color: #111; }
      .facts .value { font-weight: 700; color: #111; }
      .postpone {
        display: inline-block;
        background: #5b79b5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 64px;
        cursor: pointer;
      }
      .postpone:hover { background: #4c68a3; }
      .note { font-size: 14px; color: #6b7280; margin-top: 14px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <rect width="128" height="128" rx="28" fill="#1e1b4b"/>
          <g fill="#4338ca">
            <circle cx="24" cy="40" r="3"/><circle cx="40" cy="40" r="3"/><circle cx="56" cy="40" r="3"/>
            <circle cx="72" cy="40" r="3"/><circle cx="88" cy="40" r="3"/><circle cx="104" cy="40" r="3"/>
            <circle cx="24" cy="88" r="3"/><circle cx="40" cy="88" r="3"/><circle cx="56" cy="88" r="3"/>
            <circle cx="72" cy="88" r="3"/><circle cx="88" cy="88" r="3"/><circle cx="104" cy="88" r="3"/>
          </g>
          <path d="M24 64 L40 64 L56 36 L72 96 L88 52 L104 64" fill="none" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <g fill="#818cf8">
            <circle cx="24" cy="64" r="6.5"/><circle cx="40" cy="64" r="6.5"/><circle cx="56" cy="36" r="6.5"/>
            <circle cx="72" cy="96" r="6.5"/><circle cx="88" cy="52" r="6.5"/><circle cx="104" cy="64" r="6.5"/>
          </g>
        </svg>
        WebPulse
      </div>
      <p class="headline">You've reached your limit for today on</p>
      <div class="site">
        <img id="favicon" alt="" />
        <span id="domain"></span>
      </div>
      <p class="url" id="url"></p>
      <div class="facts">
        <span class="label">Limit:</span><span class="value" id="limit"></span>
        <span class="label">Sessions:</span><span class="value" id="sessions"></span>
      </div>
      <div>
        <button id="postpone" class="postpone hidden">+ 5 minutes</button>
        <p id="postpone-note" class="note hidden">You can postpone the blocking for 5 minutes only once during the day</p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
